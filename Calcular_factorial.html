<script>
// Calcular el factorial
// Inicio del algoritmo
let numero_ingresado=0, contador=1, factorial=1;
numero_ingresado = prompt ("Ingrese el numero del cual desea calcular el factorial")

while (contador <= numero_ingresado)
{ // Inicio de while
    factorial = factorial * contador
    contador++;
} //Fin de while

document.write("El factorial del numero ingresado es: " + factorial)





// Fin del algortimo
</script>

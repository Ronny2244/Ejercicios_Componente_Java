<script> // Inicio del algoritmo
let valora=0, valorb=0, sumasucesiva=0, contador=0; // Defina variables 

// Ingreso por teclado
valora = Number (prompt("Ingrese el valor A"));
valorb = Number (prompt("Ingrese el valor B"));
 
while (contador < valorb)
{ //Inicio while
    sumasucesiva = sumasucesiva + valora
    contador++

} //Fin while

document.write("El resultado de la multiplicacion del valor A * Valor B es igual a: " + sumasucesiva)


// Fin del algoritmo
</script>

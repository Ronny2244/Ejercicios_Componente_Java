<script>
// Inicio del algoritmo 
// Algoritmo para calcular la serie de Fibonacci
let serie=0, numero1=1, numero2=0, contador=0;
while (contador <= 100) 

{ // Inicio del mientras
    
    serie = numero1 + numero2;
    console.log(serie);
    // Cambio de variables
    numero1 = numero2;
    numero2 = serie;

    // Incremento 
    contador++

}// Fin del mientras

 
// Fin del algoritmo
</script>

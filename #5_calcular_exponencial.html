<script>
// Inicio del algoritmo
let base=0, exponente=0, contador=1, resultado= 1;

base = prompt ("Ingrese la base de la potencia")
exponente = prompt ("Ingrese el exponente")


while (contador <= exponente) 
{ // Inicio de while
    resultado = resultado * base
    contador++

}
document.write ("La respuesta es: " + resultado)
// Fin del algortimo
</script>

<script> 
// Inicio del algoritmo
    let divisor=2, primo=1, contador=0; // Variables

    While(contador <= 10) 
    { // Inicio del While
        primo = contador % divisor
        divisor++;
        contador++;
    } // Fin del while

if  (primo == 0 )
{ // Inicio del condicional SI
    document.write(prompt "El numero es primo"" + primo);
}
else
{
    document.write(prompt "El numero no es primo" + primo);
}


// Fin del algoritmo
</script>
